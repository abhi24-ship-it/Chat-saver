<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat Saver</title>
  <style>
    @page { margin: 15mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { max-width: 780px; margin: 0 auto; padding: 16px; font: 11pt/1.5 system-ui, "Segoe UI", sans-serif; color: #111; background: #fff; }
    h1 { font-size: 20pt; margin: 0 0 4px; }
    .meta { color: #666; margin-top: 0; }
    .msg { border-top: 1px solid #ccc; margin-top: 14px; padding-top: 6px; }
    .msg > h2.who { font-size: 10pt; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin: 0 0 4px; }
    .msg.user > h2.who { color: #0a58ca; }
    .user-text { white-space: pre-wrap; }
    pre { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    pre, code { font-family: Consolas, "Courier New", monospace; font-size: 9pt; }
    :not(pre) > code { background: #eee; padding: 0 3px; border-radius: 3px; }
    table { border-collapse: collapse; margin: 8px 0; }
    th, td { border: 1px solid #999; padding: 4px 8px; text-align: left; vertical-align: top; }
    th { background: #eee; }
    tr { break-inside: avoid; }
    blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid #ccc; color: #444; }
  </style>
</head>
<body>
  <div id="content">Loading…</div>
  <script src="print.js"></script>
</body>
</html>
