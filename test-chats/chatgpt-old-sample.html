<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Explain RAG simply</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; }
    .banner { background: #fff3cd; padding: 8px; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    [data-message-author-role="user"] { background: #f0f0f0; border-radius: 12px; padding: 8px 12px; margin: 12px 0 12px 25%; }
    .whitespace-pre-wrap { white-space: pre-wrap; }
    pre { background: #222; color: #eee; padding: 8px; border-radius: 8px; }
    td, th { border: 1px solid #aaa; padding: 4px; }
    table { border-collapse: collapse; }
  </style>
</head>
<body>
  <p class="banner">Test page for Chat Saver: a fake <b>ChatGPT-style</b> chat with 60 messages. Click the Chat Saver icon.</p>
  <main id="thread"></main>

  <script src="sample-data.js"></script>
  <script>
    // ChatGPT puts the language label and Copy button INSIDE the <pre>.
    function codeBlock(lang, code) {
      return `<pre class="overflow-visible!"><div class="contain-inline-size rounded-2xl">` +
        `<div class="flex items-center text-xs">${lang}</div>` +
        `<div class="sticky top-9"><button>Copy code</button></div>` +
        `<div class="overflow-y-auto p-4" dir="ltr"><code class="whitespace-pre! language-${lang}">${highlight(code)}</code></div>` +
        `</div></pre>`;
    }
    const thread = document.getElementById('thread');
    for (let n = 1; n <= 30; n++) {
      thread.insertAdjacentHTML('beforeend', `
        <article data-testid="conversation-turn-${2 * n - 1}">
          <h5 class="sr-only">You said:</h5>
          <div data-message-author-role="user"><div class="whitespace-pre-wrap">${esc(question(n))}</div></div>
        </article>
        <article data-testid="conversation-turn-${2 * n}">
          <h6 class="sr-only">ChatGPT said:</h6>
          <div data-message-author-role="assistant"><div class="markdown prose">${answer(n, codeBlock)}</div></div>
          <div><button>Copy</button><button>Good response</button></div>
        </article>`);
    }
  </script>
</body>
</html>
